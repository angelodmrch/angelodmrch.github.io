<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Angelo Demarchi</title>
        <meta name="author" content="Angelo Demarchi" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="pinterest" content="nopin" />

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="assets/fonts/fontawesome/css/all.min.css">

        <style>
            :root {
                --primariy: #EDEDED;
                --secondary: #4E9F3D;
                --background: #191A19;
            }

            html {
                padding: 0;
                margin: 0;
                background-color: var(--background);
            }
            
            body {
                font-family: 'Poppins', sans-serif;
                text-align: center;
                display: flex;
                place-items: center;
                justify-content: center;
                min-height: 100vh;
                padding: 0;
                margin: 0;
                color: var(--primariy);
            }
            
            .container {
                max-width: 960px;
                margin: 0 auto;
            }

            .container img {
                border-radius: 50%;
                width: 200px;
                height: 200px;
            }

            .container ul {
                list-style: none;
                padding: 0;
                padding-top: 40px;
                margin: 0;
                display: flex;
                flex-wrap: wrap;
                gap: 40px;
                justify-content: center;
            }

            .container li {
                display: block;
            }

            .container li a {
                text-decoration: none;
                color: inherit;
                font-size: 50px;
            }

            .container li a:hover,
            .container li a:focus {
                color: var(--secondary);
            }
        </style>
    </head>

    <body>
        <div class="container">

            <img src="assets/images/avatar.jpg" alt="Angelo">

            <h1>Angelo Demarchi</h1>
            <p>Web Developer</p>

            <ul>
                <li>
                    <a href="https://www.linkedin.com/in/angelo-demarchi-5a229479" target="_blank">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>
                </li>
                <li>
                    <a href="https://github.com/angelodmrch" target="_blank">
                        <i class="fa-brands fa-github"></i>
                    </a>            
                </li>
            </ul>
        </div>
    </body>
</html>
